build:
  stage: build
  image:
    name: $CI_REGISTRY_IMAGE/kaniko:debug
    entrypoint: [""]
  parallel:
    matrix:
      - SERVICE_NAME: [backend, pipeline, frontend]
  before_script:
    - mkdir -p "$CI_PROJECT_DIR/.docker"
    - |
      cat > "$CI_PROJECT_DIR/.docker/config.json" <<JSON
      {"auths": {"${CI_REGISTRY}": {"username": "${CI_REGISTRY_USER}", "password": "${CI_REGISTRY_PASSWORD}"}}}
      JSON
  script:
    - /kaniko/executor
        --context $CI_PROJECT_DIR/$SERVICE_NAME
        --dockerfile $CI_PROJECT_DIR/$SERVICE_NAME/Dockerfile
        --destination $CI_REGISTRY_IMAGE/$SERVICE_NAME:${CI_COMMIT_TAG:-ci-test}
        --cache=true
        --cache-repo=$CI_REGISTRY_IMAGE/kaniko-cache
        --cache-ttl=168h
  rules:
    - if: "$CI_COMMIT_TAG"
    - if: $CI_COMMIT_BRANCH == "ci-test"

build:documentation:
  stage: build
  image: $CI_REGISTRY_IMAGE/node:20-alpine
  before_script:
    - if [ -d documentation ]; then
        cd documentation;
      else
        echo "No documentation directory" && exit 0;
      fi
  script:
    - npm ci --cache .npm
    - npm run build --if-present
  cache:
    paths:
      - frontend/.npm
  artifacts:
    paths:
      - ./documentation/build