deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache git openssh

    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519

    - ssh-keyscan github.com >> ~/.ssh/known_hosts

    - git config --global user.email "ci@local"
    - git config --global user.name "gitlab-mirror"

  script:
    - git remote add github git@github.com:Karma0410/medviz.git || true
    - git push github HEAD:main --force
    - git push github --tags

  only:
    - main
    - ci-test

deploy:documentation:
  stage: deploy
  script:
    - mv ./documentation/build public/
  artifacts:
    paths:
      - public
  only:
    - main
    - ci-test