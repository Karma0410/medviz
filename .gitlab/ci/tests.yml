tests:backend:
  stage: tests
  image: $CI_REGISTRY_IMAGE/python:3.13-slim
  parallel:
    matrix:
      - SERVICE_NAME: [backend, pipeline]
  variables:
    UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  before_script:
    - if [ -d $SERVICE_NAME ]; then
        cd $SERVICE_NAME;
      else
        echo "No $SERVICE_NAME directory" && exit 1;
      fi
    - python -m pip install --upgrade pip
    - pip install uv
  script:
    - uv sync
    - uv run pytest -q
  cache:
    key:
      files:
        - $SERVICE_NAME/uv.lock
    paths:
      - .cache/uv
  allow_failure: false
  rules:
    - if: "$CI_COMMIT_TAG"
      when: always
    - if: $CI_COMMIT_BRANCH == "ci-test"
      when: always
    - changes:
        - backend/pyproject.toml
        - backend/**/*.py
        - pipeline/pyproject.toml
        - pipeline/worker/**/*.py

tests:frontend:
  stage: tests
  image: $CI_REGISTRY_IMAGE/node:20-alpine
  before_script:
    - apk add --no-cache curl
    - if [ -d frontend ]; then
        cd frontend;
      else
        echo "No frontend directory" && exit 0;
      fi
  script:
    - npm ci --cache .npm
    - npm run build --if-present
      # verify build output exists
    - if [ -d dist ]; then
        echo "build OK";
      else
        echo "No dist directory after build" && exit 1;
      fi
      # serve briefly and curl root to ensure frontend starts (uses npx to avoid persistent deps)
    - npx serve -s dist -l 5000 > serve.log 2>&1 &
    - npx --yes wait-on http://localhost:5000 --timeout 10000
    - curl -f http://localhost:5000
    - echo "==== serve logs ===="
    - cat serve.log || true
  cache:
    paths:
      - frontend/.npm
  tags: []
  allow_failure: false
  rules:
    - if: "$CI_COMMIT_TAG"
      when: always
    - if: $CI_COMMIT_BRANCH == "ci-test"
      when: always
    - changes:
        - frontend/package.json
        - frontend/**/*.ts*