services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frontend_net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile.dev
    container_name: frontend
    restart: always
    volumes:
      - ../frontend:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost/api
      VITE_API_WS_URL: ws://localhost/ws
    ports:
      - "3000:3000"
    networks:
      - frontend_net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    container_name: backend
    restart: always
    volumes:
      - ../backend:/app
      - shared_data:/app/data
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/medviz
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    networks:
      - backend_net
      - frontend_net

  pipeline:
    build:
      context: ../pipeline
    container_name: pipeline
    restart: always
    volumes:
      - shared_data:/app/data
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    networks:
      - backend_net

  redis:
    image: redis:8-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - backend_net

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medviz
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net

volumes:
  postgres_data:
  shared_data:

networks:
  frontend_net:
    driver: bridge

  backend_net:
    driver: bridge